# pixi.toml — 玄枢 / XuanHub 任务入口
# 纯任务管理：C++ 工具链（MSVC 2022 / Qt 6.9.3 / CMake）均为系统安装，不走 conda 依赖。
# 用法：`pixi run <任务名>`，列出全部任务：`pixi task list`

[workspace]
name = "xuanhub"
version = "0.2.1"
description = "玄枢 XuanHub — Qt6/QML Windows 插件化状态栏框架"
channels = []
platforms = ["win-64"]

[tasks]
# ── 构建 ──────────────────────────────────────────────
configure = { cmd = "cmake --preset default", description = "CMake 配置（生成到 build/default，VS 17 2022 生成器）" }
build = { cmd = "cmake --build --preset default", depends-on = ["configure"], description = "Release 构建（POST_BUILD 已带 windeployqt）" }
build-debug = { cmd = "cmake --build --preset default-debug", depends-on = ["configure"], description = "Debug 构建" }

# ── 运行 / 调试 ───────────────────────────────────────
setup-config = { cmd = "cmake -E copy_if_different config/config.json build/default/dist/Release/config.json", description = "拷贝开发用示例配置到 dist（CMake 不会自动拷贝）" }
run = { cmd = 'build/default/dist/Release/XuanHub.exe', depends-on = ["build", "setup-config"], description = "构建并运行 XuanHub" }
run-settings = { cmd = 'build/default/dist/Release/XuanHub.exe --settings', depends-on = ["build", "setup-config"], description = "构建并运行，启动即打开设置窗口" }
log = { cmd = 'powershell -NoProfile -Command "Get-Content $env:APPDATA/XuanHub/xuanhub.log -Tail 80"', description = "查看运行日志尾部（%APPDATA%/XuanHub/xuanhub.log）" }
plugin-validate = { cmd = "python scripts/xuanhub_plugin.py validate", description = "静态校验插件目录；在命令末尾追加插件路径" }
plugin-test = { cmd = "python scripts/xuanhub_plugin.py test", description = "通过隔离 Worker 测试 Python 插件；在命令末尾追加插件路径" }
plugin-run = { cmd = "python scripts/xuanhub_plugin.py run", description = "在最小 Qt 上下文中加载插件 QML；在命令末尾追加插件路径" }
plugin-create = { cmd = "python scripts/xuanhub_plugin.py create", description = "生成 C++/Python 插件模板；在命令末尾追加参数" }
plugin-package = { cmd = "python scripts/xuanhub_plugin.py package", description = "校验并创建 PF-09 .xuanplugin；在命令末尾追加参数" }
plugin-doctor = { cmd = "python scripts/xuanhub_plugin.py doctor", description = "检查 Python 依赖或原生 DLL；在命令末尾追加插件路径" }

# ── 分发 ──────────────────────────────────────────────
deploy = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy_qt.ps1", description = "手动重新部署 Qt 依赖（windeployqt 自动定位：PATH → CMakeCache，Qt 升级或未重新链接时用）" }
package = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_portable.ps1", depends-on = ["build"], description = "便携分发打包（默认不内置 Python 标准库，产出 dist/*.zip）" }
package-bundle = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_portable.ps1 -PythonStrategy Bundle", depends-on = ["build"], description = "免安装打包：内置 Python 标准库，Python 子插件开箱即用" }
package-bundle-full = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_portable.ps1 -PythonStrategy Bundle -BundlePipPackages \"bleak,winrt,typing_extensions\"", depends-on = ["build"], description = "免安装打包并注入 bleak：心率插件开箱即用" }
package-nozip = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_portable.ps1 -NoZip", depends-on = ["build"], description = "只准备便携目录，不打 zip" }

# ── 清理 ──────────────────────────────────────────────
clean = { cmd = "cmake -E remove_directory build/default", description = "删除整个构建目录（下次 build 会重新 configure）" }
